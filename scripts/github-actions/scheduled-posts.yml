name: Auto Generate & Send X Posts to WhatsApp

on:
  # Daily scheduled triggers at 9:00 AM, 2:00 PM, and 8:00 PM Pakistan Time (PKT / UTC+5)
  # 9:00 AM PKT = 04:00 UTC
  # 2:00 PM PKT = 09:00 UTC
  # 8:00 PM PKT = 15:00 UTC
  schedule:
    - cron: '0 4,9,15 * * *'

  # Allows manual execution anytime via the GitHub Actions UI ("Run workflow" button)
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom topic to generate (leave empty for auto trending theme)'
        required: false
        default: ''

jobs:
  trigger-post-generation:
    name: Generate Post & Send to WhatsApp
    runs-on: ubuntu-latest
    steps:
      - name: Display Trigger Info
        run: |
          echo "=========================================================="
          echo "⏰ X_BOT Auto-Post Trigger"
          echo "Timestamp UTC: $(date -u)"
          echo "Schedule: 9:00 AM, 2:00 PM, 8:00 PM PKT"
          echo "=========================================================="

      - name: Send Post Request to Render Bot Server
        run: |
          RENDER_URL="https://x-bot-7p2s.onrender.com"
          TOPIC="${{ github.event.inputs.custom_topic }}"

          echo "Target Endpoint: $RENDER_URL/generate"
          echo "Connecting to Render server..."

          # Prepare JSON payload
          if [ -n "$TOPIC" ]; then
            PAYLOAD="{\"topic\": \"$TOPIC\"}"
          else
            PAYLOAD="{}"
          fi

          echo "Payload: $PAYLOAD"
          echo "Sending POST request..."

          HTTP_RAW=$(curl -s -S -X POST "$RENDER_URL/generate" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Scheduler/1.0" \
            -d "$PAYLOAD" \
            -w "\nHTTP_STATUS_CODE:%{http_code}" \
            --max-time 180)

          HTTP_CODE=$(echo "$HTTP_RAW" | grep "HTTP_STATUS_CODE:" | cut -d':' -f2)
          RESPONSE=$(echo "$HTTP_RAW" | sed '/HTTP_STATUS_CODE:/d')

          echo "=========================================================="
          echo "HTTP Status Code from Render: $HTTP_CODE"
          echo "Raw Server Response:"
          echo "$RESPONSE"
          echo "=========================================================="

          # Verify delivery outcome
          if echo "$RESPONSE" | grep -q '"sent":true'; then
            echo "✓ Success! Post generated AND successfully delivered to Owner WhatsApp."
          elif echo "$RESPONSE" | grep -q '"success":true'; then
            echo "⚠ Notice: Post was successfully generated by AI on backend, but WhatsApp dispatch failed."
            echo "Reason: Check the 'error' field in the JSON response above (e.g. Meta API access block or permissions)."
          else
            echo "❌ Error: Render server did not return success:true (HTTP $HTTP_CODE)."
            echo "$RESPONSE"
            exit 1
          fi
