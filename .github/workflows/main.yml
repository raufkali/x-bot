name: Auto Generate & Send X Posts to WhatsApp

on:
  schedule:
    # 9:00 AM, 2:00 PM, 8:00 PM Pakistan Time (PKT)
    - cron: '0 4,9,15 * * *'
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom topic (leave empty for auto trending theme)'
        required: false
        default: ''

jobs:
  trigger-post-generation:
    name: Generate Post & Send to WhatsApp
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Server
        run: |
          RENDER_URL="https://x-bot-7p2s.onrender.com"
          TOPIC="${{ github.event.inputs.custom_topic }}"

          if [ -n "$TOPIC" ]; then
            PAYLOAD="{\"topic\": \"$TOPIC\"}"
          else
            PAYLOAD="{}"
          fi

          echo "Triggering $RENDER_URL/generate..."
          RESPONSE=$(curl -s -S -X POST "$RENDER_URL/generate" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            --max-time 180)

          echo "$RESPONSE"
